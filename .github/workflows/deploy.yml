name: 部署前端到 CloudBase

# 触发：push 到 main 自动部署；也可在 Actions 页面手动点 Run workflow
#
# 为什么用 GitHub Actions 而不是控制台「Git 仓库部署」：
#   本环境（免费版）的「Git 个人仓库部署 / 公开仓库部署」入口并未真正绑定仓库——
#   实测应用创建与“构建完成”仅差 1 秒，BuildConfig 为空，push 后不产生新版本，
#   实际执行的是「自定义部署」（本地上传）。故改用 Actions 自行构建 + CLI 上传。
#
# 本 workflow 做两件事：
#   1. 构建前端并覆盖静态托管根目录；
#   2. 当 cloudbase/functions/** 有改动时，同步云函数 english-api 的代码。
#   云函数的环境变量（AUTH_SECRET）与 /api 网关路由不在此改动，保持控制台配置。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 部署到静态托管根目录
        # 直接调用 @cloudbase/manager-node 的 hosting.uploadFiles，
        # 与 tcb hosting deploy 同一套底层实现，但不经过 CLI 登录流程
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: node scripts/cloudbase-deploy.cjs

      - name: 判断云函数是否有改动
        id: fnchanged
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1 && \
             ! git diff --name-only HEAD^ HEAD | grep -q '^cloudbase/functions/'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "云函数未改动，跳过代码同步"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到云函数改动（或无法比对历史），执行代码同步"
          fi

      - name: 同步云函数 english-api 代码
        if: steps.fnchanged.outputs.changed == 'true'
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: node scripts/cloudbase-function-deploy.cjs

      - name: 复验线上
        # 仅作信息输出，不让非 200 影响部署结果判定
        run: |
          BASE="https://cloud1-d5giiwkzidd6e6c60-1326691077.ap-shanghai.app.tcloudbase.com"
          echo "首页产物："
          curl -sS --max-time 20 -H "Cache-Control: no-cache" "$BASE/" | grep -oE 'assets/[^"]+' || true
          for p in /login /data; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$p" || echo "ERR")
            echo "$p -> $code"
          done
          echo "未登录 /api 应为 401："
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 "$BASE/api/quotes/daily" || true
