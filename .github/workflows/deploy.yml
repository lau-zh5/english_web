name: 部署前端到 CloudBase

# 触发：push 到 main 自动部署；也可在 Actions 页面手动点 Run workflow
#
# 为什么用 GitHub Actions 而不是控制台「Git 仓库部署」：
#   本环境（免费版）的「Git 个人仓库部署 / 公开仓库部署」入口并未真正绑定仓库——
#   实测应用创建与“构建完成”仅差 1 秒，BuildConfig 为空，push 后不产生新版本，
#   实际执行的是「自定义部署」（本地上传）。故改用 Actions 自行构建 + CLI 上传。
#
# 本 workflow 只做一件事：构建前端并覆盖静态托管根目录。
#   不重建云函数 english-api、不改 /api 网关路由——这两者改动时用本机 `tcb deploy --yes`。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 安装 CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: 诊断凭证注入情况
        # 只打印长度，不打印内容，用于区分「没配 Secret」与「Secret 值有误」
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          echo "SecretId 长度: ${#TCB_SECRET_ID}"
          echo "SecretKey 长度: ${#TCB_SECRET_KEY}"
          echo "EnvId: $TCB_ENV_ID"

      - name: 部署到静态托管根目录
        # 用腾讯云 SDK 标准环境变量传凭证，跳过 tcb login 子命令
        # Linux 环境不存在 Git Bash 把 / 转成 PortableGit 路径的问题
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TCB_SECRET_ID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TCB_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-shanghai
        run: tcb hosting deploy ./dist / -e "${{ secrets.TCB_ENV_ID }}"

      - name: 复验线上
        # 仅作信息输出，不让非 200 影响部署结果判定
        run: |
          BASE="https://cloud1-d5giiwkzidd6e6c60-1326691077.ap-shanghai.app.tcloudbase.com"
          echo "首页产物："
          curl -sS --max-time 20 -H "Cache-Control: no-cache" "$BASE/" | grep -oE 'assets/[^"]+' || true
          for p in /login /data; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$p" || echo "ERR")
            echo "$p -> $code"
          done
          echo "未登录 /api 应为 401："
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 "$BASE/api/quotes/daily" || true
